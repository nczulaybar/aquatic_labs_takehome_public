[project]
name = "aquatic-labs-takehome-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Nicolo",email = "nczulaybar@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.121.2,<0.122.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "time-machine (>=2.19.0,<3.0.0)",
    "polars (>=1.35.2,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
httpx = "^0.28.1"
pytest-asyncio = "^1.3.0"
ruff = "^0.14.5"

